# Private singleton barkd wallet used by the Noah mainnet server.

app = "noah-barkd-mainnet"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  image = "niteshbalusu/noah-barkd:0.6.2"

[deploy]
  strategy = "rolling"
  wait_timeout = "10m"

[[restart]]
  policy = "always"

[env]
  BARKD_DATADIR = "/data/barkd"
  BARKD_BIND_HOST = "::"
  BARKD_BIND_PORT = "3000"

[[mounts]]
  source = "bark_data"
  destination = "/data"
  scheduled_snapshots = true
  snapshot_retention = 30

[checks.barkd_tcp]
  type = "tcp"
  port = 3000
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
