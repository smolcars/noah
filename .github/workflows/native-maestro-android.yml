name: Native Maestro Android

on:
  workflow_call:
    inputs:
      apk_artifact_name:
        required: true
        type: string
      profile:
        type: string
        default: pixel_7_pro
      adaptive:
        type: boolean
        default: false

env:
  NIX_CONFIG: |
    post-build-hook =
    extra-substituters =
    substituters = https://cache.nixos.org/

jobs:
  maestro-test:
    name: Native Maestro Android
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: noah-native-maestro-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.profile }}
      ANDROID_SERIAL: emulator-5554
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
      MAESTRO_EMULATOR_GRPC_PORT: "8592"
      MAESTRO_DEBUG_OUTPUT: native-maestro-output
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Restore Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-android-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-android-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare Maestro environment
        run: nix build .#devShells.x86_64-linux.android-ci --no-link

      - name: Set up cached Docker builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: noah/maestro-server-amd64

      - name: Build server image for regtest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-noah-server
          load: true

      - name: Set up regtest
        run: |
          docker compose -f scripts/docker-compose.yml pull --ignore-buildable
          nix develop .#android-ci --command just setup-everything

      - name: Enable KVM
        run: |
          emulator_runtime_dir="$RUNNER_TEMP/android-runtime"
          mkdir -p "$emulator_runtime_dir"
          chmod 700 "$emulator_runtime_dir"
          echo "XDG_RUNTIME_DIR=$emulator_runtime_dir" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Resolve emulator SDK path
        id: sdk
        run: echo "root=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

      - name: Cache emulator system image
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: android-emulator-image-${{ runner.os }}-${{ runner.arch }}-36-google-apis
          path: ${{ steps.sdk.outputs.root }}/system-images/android-36/google_apis/x86_64

      - name: Download existing CI APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.apk_artifact_name }}
          path: android-release-build

      - name: Run native Maestro suite
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.profile }}
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -grpc 8592 -grpc-use-token
          disable-animations: false
          # The runner executes each line separately. `am instrument` exits 0 even on failures, so check for "OK (".
          script: |
            nix develop .#android-ci --command scripts/test-maestro-native.sh android android-release-build/regtest/debug/app-regtest-debug.apk emulator-5554 "${{ inputs.adaptive && 'adaptive' || 'all' }}"
            adb install -r -t android-release-build/androidTest/regtest/debug/app-regtest-debug-androidTest.apk
            adb shell am instrument -w -e class com.noahwallet.ui.AdaptiveLayoutDeviceTest,com.noahwallet.ui.AdaptiveStateRestorationTest com.noahwallet.regtest.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q '^OK (' instrumentation.txt

      - name: Collect regtest logs
        if: failure()
        run: docker compose -f scripts/docker-compose.yml logs --no-color > regtest.log 2>&1

      - name: Clean up regtest
        if: always()
        run: docker compose -f scripts/docker-compose.yml down --volumes

      - name: Upload diagnostics and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-maestro-android-${{ inputs.profile }}-debug
          include-hidden-files: true
          path: |
            native-maestro-output
            regtest.log
            instrumentation.txt
          if-no-files-found: ignore
