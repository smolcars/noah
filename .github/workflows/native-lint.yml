name: Native lint

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "apps/android/**"
      - "apps/fixtures/**"
      - "apps/tools/check-fixture-twins*.mjs"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - ".github/workflows/native-lint.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The same pinned tools as the pre-commit hook, from the flake's native-lint shell. Compiler warnings
# and Android Lint run in native-ios.yml and native-android.yml, which build the apps anyway.
jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Lint
        run: nix develop .#native-lint --command just ${{ matrix.platform }}-native-lint

  # Each shared fixture is loaded by an iOS and an Android test that pull requests run, or
  # apps/fixtures/one-platform.txt says which app lacks it and why.
  fixture-twins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Test the fixture twin check
        run: bun test apps/tools/check-fixture-twins.test.mjs

      - name: Check both apps load each shared fixture
        run: bun apps/tools/check-fixture-twins.mjs
