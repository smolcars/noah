name: Maestro Test iOS

env:
  # Self-hosted runners persist /nix/store; avoid stale Magic Nix Cache hooks/proxies.
  NIX_CONFIG: |
    post-build-hook =
    extra-substituters =
    substituters = https://cache.nixos.org/

on:
  workflow_dispatch:
    inputs:
      simulator:
        description: "Duo is experimental while Maestro's iOS 27.1 tab hierarchy support is pending"
        type: choice
        options: ["iPhone 17 Pro", "iPhone Duo"]
        default: "iPhone 17 Pro"
  pull_request:
    paths:
      - "client/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - ".github/workflows/**"
      - "!**/*.md"

jobs:
  build-release-ios:
    name: Build iOS Release App
    uses: ./.github/workflows/noah-build-release-ios.yml
    secrets: inherit

  maestro-test-ios:
    name: Maestro Test iOS (${{ inputs.simulator || 'iPhone 17 Pro' }})
    needs: build-release-ios
    runs-on: macOS
    timeout-minutes: 25
    permissions:
      checks: read
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v6

      - name: 📥 Download iOS app artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-release-ios.outputs.artifact_name }}
          path: ios-release-build

      - name: 🗜️ Decompress iOS app
        run: |
          cd ios-release-build
          unzip ios-release.zip
          rm ios-release.zip

      - name: 🔧 Setup Regtest Environment
        run: cd scripts && docker-compose pull && docker-compose build && ./ark-dev.sh setup-everything

      - name: 📱 Create isolated iOS simulator
        env:
          SIMULATOR_MODEL: ${{ inputs.simulator || 'iPhone 17 Pro' }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          def simctl(*args):
              return subprocess.check_output(["xcrun", "simctl", *args], text=True).strip()
          devices = json.loads(simctl("list", "devicetypes", "-j"))["devicetypes"]
          device = next(d for d in devices if d["name"] == os.environ["SIMULATOR_MODEL"])
          runtimes = json.loads(simctl("list", "runtimes", "-j"))["runtimes"]
          runtimes = [r for r in runtimes if r["isAvailable"] and ".iOS-" in r["identifier"] and tuple(map(int, r["version"].split("."))) >= (27, 1)]
          assert runtimes, "Install iOS 27.1 or later on the macOS runner for Duo coverage"
          runtime = max(runtimes, key=lambda r: tuple(map(int, r["version"].split("."))))
          udid = simctl("create", "Noah CI " + os.environ["SIMULATOR_MODEL"], device["identifier"], runtime["identifier"])
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SIMULATOR_ID={udid}\n")
          subprocess.check_call(["xcrun", "simctl", "boot", udid])
          subprocess.check_call(["xcrun", "simctl", "bootstatus", udid, "-b"])
          PYTHON

      - name: 🧪 Run Maestro tests
        run: nix develop .# --command bash -c "xcrun simctl install \"$SIMULATOR_ID\" ios-release-build/ios-release.app && bun client maestro:test --udid \"$SIMULATOR_ID\" && maestro --udid \"$SIMULATOR_ID\" test --debug-output client/maestro-debug-output/adaptive client/tests/maestro/adaptive-layout-smoke.yml && scripts/test-send-regtest.sh"
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 120000

      - name: 🧹 Delete CI simulator
        if: always()
        run: |
          if [ -n "${SIMULATOR_ID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_ID" || true
            xcrun simctl delete "$SIMULATOR_ID"
          fi

      - name: 🧹 Teardown Regtest Environment
        if: always()
        run: ./scripts/ark-dev.sh down

      - name: 📤 Store debug output if failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug-output-ios
          path: client/maestro-debug-output/**/*
          include-hidden-files: true
          overwrite: true

  maestro_test_gate:
    name: Maestro Test iOS Gate
    runs-on: ubuntu-latest
    needs: maestro-test-ios
    if: always()
    steps:
      - name: ✅ Gate
        run: |
          if [[ "${{ needs.maestro-test-ios.result }}" == "success" || "${{ needs.maestro-test-ios.result }}" == "skipped" ]]; then
            echo "Maestro tests passed or skipped"
            exit 0
          else
            echo "Maestro tests failed"
            exit 1
          fi
