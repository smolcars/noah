name: CI

env:
  # Self-hosted runners persist /nix/store; avoid stale Magic Nix Cache hooks/proxies.
  NIX_CONFIG: |
    post-build-hook =
    extra-substituters =
    substituters = https://cache.nixos.org/

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      build_aab:
        description: "Whether to build AAB in addition to APK"
        required: false
        type: boolean
        default: false
    outputs:
      apk_filename:
        description: "The filename of the APK"
        value: ${{ jobs.android_build.outputs.apk_filename }}
      apk_artifact_name:
        description: "The artifact name for the APK"
        value: ${{ jobs.android_build.outputs.apk_artifact_name }}
      aab_filename:
        description: "The filename of the AAB"
        value: ${{ jobs.android_build.outputs.aab_filename }}
      aab_artifact_name:
        description: "The artifact name for the AAB"
        value: ${{ jobs.android_build.outputs.aab_artifact_name }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      client_changed: ${{ steps.set_changed.outputs.client_changed }}
    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@v6

      - name: 🔎 Detect client-related changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'client/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'patches/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'Dockerfile'
              - '.github/workflows/**'

      - name: 🧭 Set client change output
        id: set_changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_CLIENT: ${{ steps.filter.outputs.client }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "client_changed=${FILTER_CLIENT}" >> "$GITHUB_OUTPUT"
          else
            # For workflow_call, always run client checks/build.
            echo "client_changed=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.client_changed == 'true'
    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@v6

      - name: 📦 Install signet app dependencies
        run: nix develop .# --command bash -c "bun install --frozen-lockfile"

      - name: ✨ Lint code
        run: nix develop .# --command bash -c "bun client lint"

      - name: 🧪 Run unit tests
        run: nix develop .# --command bash -c "bun client test:unit"

      - name: 🔍 Typecheck code
        run: nix develop .# --command bash -c "bun client typecheck"

  android_build:
    runs-on: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'blacksmith-8vcpu-ubuntu-2404' || 'self-hosted' }}
    timeout-minutes: 60
    needs: [changes, lint]
    if: needs.changes.outputs.client_changed == 'true'
    outputs:
      apk_filename: ${{ steps.rename_apk.outputs.apk_filename }}
      apk_artifact_name: ${{ steps.rename_apk.outputs.artifact_name }}
      aab_filename: ${{ steps.aab_meta.outputs.aab_filename }}
      aab_artifact_name: ${{ steps.aab_meta.outputs.artifact_name }}
    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@v6

      - name: Select Android build
        id: build_config
        env:
          REGTEST_BUILD: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$REGTEST_BUILD" == "true" ]]; then
            printf 'shell=android-ci\nvariant=regtest\nscript=build:android:regtest:release\nsdk_root=%s\n' "$ANDROID_HOME" >> "$GITHUB_OUTPUT"
          else
            printf 'shell=default\nvariant=signet\nscript=build:android:signet:ci:apk\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.build_config.outputs.variant == 'regtest'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Restore Nix store
        if: steps.build_config.outputs.variant == 'regtest'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-android-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-android-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Gradle
        if: steps.build_config.outputs.variant == 'regtest'
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: false

      - name: Cache Android build SDK
        if: steps.build_config.outputs.variant == 'regtest'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: android-build-sdk-${{ runner.os }}-${{ runner.arch }}-37.0-ndk27.1-cmake3.22.1
          path: |
            ${{ steps.build_config.outputs.sdk_root }}/platforms/android-37.0
            ${{ steps.build_config.outputs.sdk_root }}/build-tools/37.0.0
            ${{ steps.build_config.outputs.sdk_root }}/ndk/27.1.12297006
            ${{ steps.build_config.outputs.sdk_root }}/cmake/3.22.1

      - name: Install Android build SDK
        if: steps.build_config.outputs.variant == 'regtest'
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: 📦 Install app dependencies
        run: nix develop .#${{ steps.build_config.outputs.shell }} --command bun install --frozen-lockfile

      - name: 🔧 Create sentry.properties
        if: steps.build_config.outputs.variant == 'signet'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./scripts/create_sentry_properties.sh

      - name: 🔐 Decode keystore
        if: steps.build_config.outputs.variant == 'signet'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > client/android/app/release.keystore

      - name: 🔧 Create local.properties for release signing
        if: steps.build_config.outputs.variant == 'signet'
        env:
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./scripts/create_local_properties.sh

      - name: 🔨 Build Android release APK
        env:
          CI_DEBUG_SIGNING: ${{ steps.build_config.outputs.variant == 'regtest' }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ steps.build_config.outputs.variant == 'regtest' }}
        run: nix develop .#${{ steps.build_config.outputs.shell }} --command bun client ${{ steps.build_config.outputs.script }}

      - name: 📦 Build signet Android app (AAB)
        if: ${{ inputs.build_aab && steps.build_config.outputs.variant == 'signet' }}
        run: nix develop .# --command bash -c "bun client build:android:signet:ci:aab"

      - name: 🧹 Clean up keystore & local.properties
        if: ${{ always() }}
        run: |
          rm -f client/android/app/release.keystore
          rm -f client/android/local.properties

      - name: 📝 Rename APK for publication
        id: rename_apk
        env:
          BUILD_VARIANT: ${{ steps.build_config.outputs.variant }}
        run: |
          apk_path="client/android/app/build/outputs/apk/${BUILD_VARIANT}/release/app-${BUILD_VARIANT}-release.apk"
          new_apk_path="client/android/app/build/outputs/apk/${BUILD_VARIANT}/release/noah.apk"
          mv "${apk_path}" "${new_apk_path}"
          echo "new_path=${new_apk_path}" >> $GITHUB_OUTPUT
          echo "apk_filename=noah.apk" >> $GITHUB_OUTPUT
          echo "artifact_name=noah-android-apk" >> $GITHUB_OUTPUT
        shell: bash

      - name: 📝 Prepare AAB outputs
        id: aab_meta
        # Always run so job outputs are defined whether or not we built an AAB
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          aab_expected="client/android/app/build/outputs/bundle/signetRelease/app-signet-release.aab"
          if [[ "${{ inputs.build_aab }}" == 'true' && -f "$aab_expected" ]]; then
            timestamp=$(date +'%Y-%m-%d-%H-%M')
            aab_filename="noah-android-aab-${timestamp}.aab"
            new_aab_path="client/android/app/build/outputs/bundle/signetRelease/${aab_filename}"
            mv "$aab_expected" "$new_aab_path"
            echo "new_path=${new_aab_path}" >> "$GITHUB_OUTPUT"
            echo "aab_filename=${aab_filename}" >> "$GITHUB_OUTPUT"
            echo "artifact_name=noah-android-aab" >> "$GITHUB_OUTPUT"
          else
            echo "new_path=" >> "$GITHUB_OUTPUT"
            echo "aab_filename=" >> "$GITHUB_OUTPUT"
            echo "artifact_name=" >> "$GITHUB_OUTPUT"
          fi

      - name: 📤 Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.rename_apk.outputs.artifact_name }}
          path: ${{ steps.rename_apk.outputs.new_path }}
          if-no-files-found: error
          overwrite: true

      - name: 📤 Upload Android AAB artifact
        if: ${{ inputs.build_aab && steps.aab_meta.outputs.new_path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.aab_meta.outputs.artifact_name }}
          path: ${{ steps.aab_meta.outputs.new_path }}
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  ios_build:
    needs: changes
    if: needs.changes.outputs.client_changed == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/noah-build-release-ios.yml

  maestro_test:
    needs: [changes, android_build]
    if: needs.changes.outputs.client_changed == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/noah-maestro-test-android.yml
    with:
      apk_artifact_name: ${{ needs.android_build.outputs.apk_artifact_name }}

  client_gate:
    runs-on: ubuntu-latest
    needs: [changes, lint, android_build, ios_build, maestro_test]
    if: always()
    steps:
      - name: ✅ Gate
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Client change detection failed"
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.client_changed }}" != "true" ]]; then
            echo "No client-related changes; client checks not required"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ needs.ios_build.result }}" != "success" || "${{ needs.maestro_test.result }}" != "success" ]]; then
              echo "iOS build or Android Maestro failed"
              exit 1
            fi
          fi

          if [[ "${{ needs.lint.result }}" == "success" ]] && \
             [[ "${{ needs.android_build.result }}" == "success" ]]; then
            echo "Client checks passed"
            exit 0
          else
            echo "Client checks failed"
            exit 1
          fi
