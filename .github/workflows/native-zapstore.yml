name: Native Zapstore

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z GitHub Release to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Mainnet APK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Tag must be a vX.Y.Z release tag' >&2
            exit 1
          fi
          echo "filter=^${RELEASE_TAG//./\\.}\$" >> "$GITHUB_OUTPUT"

      # The workflow's own revision: older tags have no zapstore.yaml.
      - uses: actions/checkout@v6

      # Pinned and checksum-checked: it signs with the Zapstore key.
      - name: Install zsp
        env:
          ZSP_VERSION: 2.0.1
          ZSP_SHA256: 1ef5373f8ecd9ba63d2c3fab98abb0d31b2244a2aac31b3749fb205c7d5f5b38
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/zsp" "https://github.com/zapstore/zsp/releases/download/v$ZSP_VERSION/zsp-$ZSP_VERSION-linux-amd64"
          echo "$ZSP_SHA256  $RUNNER_TEMP/bin/zsp" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/zsp"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # zapstore.yaml picks noah-mainnet.apk; the filter pins the release to this tag.
      - name: Publish to Zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_FILTER: ${{ steps.tag.outputs.filter }}
        run: |
          set -uo pipefail
          : "${SIGN_WITH:?Missing ZAPSTORE_SIGN_WITH}"
          status=0
          zsp publish -q --json --release-filter "$RELEASE_FILTER" > "$RUNNER_TEMP/zsp.out" 2> "$RUNNER_TEMP/zsp.err" || status=$?
          cat "$RUNNER_TEMP/zsp.err" >&2
          if [[ $status -eq 0 ]]; then
            jq -r '"Zapstore: \(.version_name) (version code \(.version_code)) is \(.status). Release event `\(.id)`."' "$RUNNER_TEMP/zsp.out" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code=$(jq -Rr 'fromjson? | select(.ok == false) | .error.code' "$RUNNER_TEMP/zsp.err" | tail -n 1)
          if [[ "$code" == release_already_published ]]; then
            echo 'Zapstore already has this version code.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit 1
