name: Native Signet iOS Distribution

on:
  push:
    branches: [master]
    paths:
      - "apps/ios/**"
      - "apps/fixtures/**"
      - ".github/workflows/native-signet-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIX_CONFIG: |
    post-build-hook =
    extra-substituters =
    substituters = https://cache.nixos.org/

jobs:
  build:
    # Like ios-device-build.yml, use the existing runner's signing identity,
    # unlocked keychain and Xcode account/profiles for team AT26Z24V2Q.
    runs-on: macOS
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Prepare temporary archive directory
        run: echo "SIGNET_IOS_TEMP=$(mktemp -d /private/tmp/noah-signet-ci-XXXXXX)" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Archive Noah-Signet
        working-directory: apps/ios
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: dunder-rn
          SENTRY_PROJECT: react-native
        run: |
          nix shell --inputs-from ../.. nixpkgs#sentry-cli --command xcodebuild \
            -project Noah.xcodeproj -scheme Noah-Signet -configuration Release-Signet \
            -destination 'generic/platform=iOS' -jobs 2 -allowProvisioningUpdates \
            -derivedDataPath "$SIGNET_IOS_TEMP/DerivedData" \
            -archivePath "$SIGNET_IOS_TEMP/Noah-Signet.xcarchive" archive

      - name: Export ad-hoc IPA
        run: |
          cat > "$SIGNET_IOS_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>AT26Z24V2Q</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -allowProvisioningUpdates \
            -archivePath "$SIGNET_IOS_TEMP/Noah-Signet.xcarchive" \
            -exportOptionsPlist "$SIGNET_IOS_TEMP/ExportOptions.plist" \
            -exportPath "$SIGNET_IOS_TEMP/export"
          cp "$SIGNET_IOS_TEMP/export/Noah.ipa" "$SIGNET_IOS_TEMP/noah-native-signet.ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: noah-native-signet-ios-${{ github.sha }}
          path: ${{ env.SIGNET_IOS_TEMP }}/noah-native-signet.ipa
          if-no-files-found: error

      - name: Remove archive and DerivedData
        if: always() && env.SIGNET_IOS_TEMP != ''
        run: rm -rf "$SIGNET_IOS_TEMP"

  notify:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: noah-native-signet-ios-${{ github.sha }}

      - name: Upload IPA to Diawi and wait for download link
        id: diawi
        env:
          DIAWI_TOKEN: ${{ secrets.DIAWI_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST https://upload.diawi.com/ \
            -F "token=$DIAWI_TOKEN" -F 'file=@noah-native-signet.ipa')
          job=$(jq -er '.job | select(type == "string" and length > 0)' <<< "$response")
          echo "::add-mask::$job"
          for attempt in {1..30}; do
            response=$(curl -fsS --get https://upload.diawi.com/status \
              --data-urlencode "token=$DIAWI_TOKEN" --data-urlencode "job=$job")
            status=$(jq -er '.status' <<< "$response")
            case "$status" in
              2000)
                link=$(jq -er '.link | select(startswith("https://"))' <<< "$response")
                echo "link=$link" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              2001) echo "Waiting for Diawi ($attempt/30)..."; sleep 2 ;;
              *) echo "Diawi processing failed (status $status)." >&2; exit 1 ;;
            esac
          done
          echo 'Timed out waiting for Diawi.' >&2
          exit 1

      - name: Post Native Diawi link to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BLIXT_CHAT_ID: ${{ secrets.BLIXT_CHAT_ID }}
          BLIXT_TOPIC_ID: ${{ secrets.BLIXT_TOPIC_ID }}
          COMMIT_SHA: ${{ github.sha }}
          DIAWI_LINK: ${{ steps.diawi.outputs.link }}
        run: |
          printf 'Native Noah Signet iOS build\nDownload: %s\nCommit: %s\n' \
            "$DIAWI_LINK" "$COMMIT_SHA" > message.txt
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -F "chat_id=$BLIXT_CHAT_ID" -F "message_thread_id=$BLIXT_TOPIC_ID" \
            -F 'text=<message.txt' -o "$RUNNER_TEMP/telegram.json"
          jq -e '.ok == true' "$RUNNER_TEMP/telegram.json" > /dev/null
