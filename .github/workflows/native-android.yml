name: Native Android CI

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/fixtures/**"
      - "apps/maestro/**"
      - "api/**"
      - "client/assets/btcmap/**"
      - "client/assets/geonames/**"
      - "client/android/app/debug.keystore"
      - "justfile"
      - "Dockerfile"
      - ".github/workflows/native-android.yml"
      - "scripts/ark-dev.sh"
      - "scripts/captaind.toml"
      - "scripts/docker-compose.yml"
      - "scripts/postgres-initdb/**"
      - "scripts/test-maestro-native.sh"
      - "!**/*.md"
  # Not on merges: native-telegram-android.yml builds signet and mainnet there and saves the Nix store
  # and Gradle caches these runs restore.
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No Nix here: Gradle needs only JDK 17, and Maestro needs Maestro, just and grpcurl. The flake's
# android-ci shell stays for local use.
jobs:
  build-and-test:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Restores what native-telegram-android.yml saved on master.
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: true

      # Robolectric downloads its Android jars (~380 MB) into ~/.m2, outside the Gradle home.
      - name: Cache Robolectric jars
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('apps/android/gradle/libs.versions.toml') }}

      - name: Locate Android SDK
        id: sdk
        run: echo "root=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

      - name: Cache Android build SDK
        id: sdk-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: native-android-sdk-${{ runner.os }}-${{ runner.arch }}-37.0-37.0.0
          path: |
            ${{ steps.sdk.outputs.root }}/platforms/android-37.0
            ${{ steps.sdk.outputs.root }}/build-tools/37.0.0

      # sdkmanager can hang fetching manifests (RN run 38459305574 hit its 60-minute timeout).
      - name: Install Android build SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'

      # PRs build only regtest; the flavors differ only in their manifest and google-services.json.
      # Maestro runs the R8-minified release build (debug-signed), so a missing keep rule fails here, not at
      # launch on phones as signet run 40231709078 did. R8 overlaps the unit tests; lint vital stays in the
      # signet/mainnet builds. Only the x86_64 emulator runs this APK, so it leaves out arm64-v8a. Maestro
      # installs it; nothing rebuilds it. CI runs no instrumentation, so the device tests are only compiled.
      # --build-cache reuses task outputs from master's signet and mainnet build where they match. The configuration cache stays off: it needs a secret
      # to persist across runs, and the release builds' Sentry upload task doesn't support it.
      # Kotlin warnings fail the compile (app/build.gradle.kts); lintRegtestDebug runs every Android Lint check (app/lint.xml).
      - name: Assemble minified regtest APK, compile device tests, run unit tests and Android Lint
        env:
          CI_DEBUG_SIGNING: "true"
        working-directory: apps/android
        run: ./gradlew --build-cache --dependency-verification=strict -PnoahAbis=x86_64 :app:assembleRegtestRelease -x lintVitalRegtestRelease :app:compileRegtestDebugAndroidTestSources :app:testRegtestDebugUnitTest :app:lintRegtestDebug

      # Default compression: the APK stores its native libraries uncompressed, and zipping takes 65 MB to 31 MB.
      - name: Upload regtest APK
        uses: actions/upload-artifact@v7
        with:
          name: native-regtest-apks
          path: apps/android/app/build/outputs/apk/regtest/release/app-regtest-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-android-junit
          path: apps/android/app/build/test-results/testRegtestDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 7

  # One emulator: the flows take about 2 minutes per suite, while setting up a job takes about 5, so the smoke
  # chain and then the funded flows run on one onboarded wallet.
  maestro:
    name: Maestro
    needs: build-and-test
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: noah-native-maestro-${{ github.run_id }}-${{ github.run_attempt }}
      ANDROID_SERIAL: emulator-5554
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
      MAESTRO_EMULATOR_GRPC_PORT: "8592"
      MAESTRO_DEBUG_OUTPUT: native-maestro-output
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Maestro runs on JDK 17. jq, curl and Docker come with the runner.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install just
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just

      # Maestro stays pinned (a new release can change how flows behave), as in the flake. grpcurl reads the
      # emulator's clipboard in the funded suite.
      - name: Install Maestro and grpcurl
        env:
          MAESTRO_VERSION: 2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
          GRPCURL_VERSION: 1.9.4
          GRPCURL_SHA256: 97e13d58d2733a0e62cd2571d1d5f0c02823f0d25282f08bddedf1ad9c5d1736
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools/bin"
          curl -fsSL -o "$tools/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $tools/maestro.zip" | sha256sum -c -
          unzip -q "$tools/maestro.zip" -d "$tools"
          curl -fsSL -o "$tools/grpcurl.tar.gz" "https://github.com/fullstorydev/grpcurl/releases/download/v$GRPCURL_VERSION/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
          echo "$GRPCURL_SHA256  $tools/grpcurl.tar.gz" | sha256sum -c -
          tar -xzf "$tools/grpcurl.tar.gz" -C "$tools/bin" grpcurl
          echo "$tools/maestro/bin" >> "$GITHUB_PATH"
          echo "$tools/bin" >> "$GITHUB_PATH"

      - name: Set up cached Docker builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: noah/maestro-server-amd64

      # Rebuilds only the layers the PR changes; warm builds take seconds. No summary: its post step costs ~5 s.
      - name: Build server image for regtest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-noah-server
          load: true

      # Runs in the background while the APK downloads and the emulator boots; the suite step waits for it.
      # A fresh bash, because the step's `bash -e` would exit before recording a failed setup.
      - name: Start regtest setup
        run: |
          bash -c 'docker compose -f scripts/docker-compose.yml pull --ignore-buildable && just setup-everything; echo $? > regtest-setup.status' > regtest-setup.log 2>&1 < /dev/null &

      - name: Enable KVM
        run: |
          emulator_runtime_dir="$RUNNER_TEMP/android-runtime"
          mkdir -p "$emulator_runtime_dir"
          chmod 700 "$emulator_runtime_dir"
          echo "XDG_RUNTIME_DIR=$emulator_runtime_dir" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      # No cache for the 1.8 GB system image: restoring it ran at 20-28 MB/s (1.5-2.5 min), so the emulator
      # action downloads it from Google instead.
      - name: Download regtest APK
        uses: actions/download-artifact@v8
        with:
          name: native-regtest-apks
          path: android-release-build

      - name: Run native Maestro suite
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 4
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -grpc 8592 -grpc-use-token
          disable-animations: false
          # The runner executes each line separately; the first waits for the regtest setup and prints its log.
          script: |
            timeout 300 sh -c 'until [ -s regtest-setup.status ]; do sleep 1; done'; cat regtest-setup.log; [ "$(cat regtest-setup.status)" = 0 ]
            scripts/test-maestro-native.sh android android-release-build/app-regtest-release.apk emulator-5554 all

      - name: Collect regtest logs
        if: failure()
        run: docker compose -f scripts/docker-compose.yml logs --no-color > regtest.log 2>&1

      - name: Upload diagnostics and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-maestro-android
          include-hidden-files: true
          path: |
            native-maestro-output
            regtest.log
          if-no-files-found: ignore
