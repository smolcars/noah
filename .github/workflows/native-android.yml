name: Native Android CI

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/fixtures/**"
      - "apps/maestro/**"
      - "api/**"
      - "client/assets/btcmap/**"
      - "client/assets/geonames/**"
      - "client/android/app/debug.keystore"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/native-android.yml"
      - ".github/workflows/native-maestro-android.yml"
      - "scripts/test-maestro-native.sh"
      - "!**/*.md"
  # Mainnet and signet build on merges and tags (path filters don't apply to tags).
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "apps/android/**"
      - "apps/fixtures/**"
      - "apps/maestro/**"
      - "api/**"
      - "client/assets/btcmap/**"
      - "client/assets/geonames/**"
      - "client/android/app/debug.keystore"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/native-android.yml"
      - ".github/workflows/native-maestro-android.yml"
      - "scripts/test-maestro-native.sh"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the old run; master and tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NIX_CONFIG: |
    post-build-hook =
    extra-substituters =
    substituters = https://cache.nixos.org/

jobs:
  build-and-test:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Restore Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-android-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-android-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: false

      - name: Locate Android SDK
        id: sdk
        run: echo "root=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

      - name: Cache Android build SDK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: native-android-sdk-${{ runner.os }}-${{ runner.arch }}-37.0-37.0.0
          path: |
            ${{ steps.sdk.outputs.root }}/platforms/android-37.0
            ${{ steps.sdk.outputs.root }}/build-tools/37.0.0

      - name: Install Android build SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'

      # PRs build only regtest; the flavors differ only in their manifest and google-services.json.
      - name: Assemble and run unit tests
        env:
          OTHER_FLAVORS: ${{ github.event_name == 'push' && ':app:assembleMainnetDebug :app:assembleSignetDebug' || '' }}
        run: |
          nix develop .#android-ci --command bash -c "cd apps/android && ./gradlew --max-workers=2 --dependency-verification=strict $OTHER_FLAVORS :app:assembleRegtestDebug :app:testRegtestDebugUnitTest"

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-android-junit
          path: apps/android/app/build/test-results/testRegtestDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload native regtest APK
        uses: actions/upload-artifact@v7
        with:
          name: native-regtest-apk
          path: apps/android/app/build/outputs/apk/regtest/debug/app-regtest-debug.apk
          if-no-files-found: error
          retention-days: 7

  maestro:
    needs: build-and-test
    uses: ./.github/workflows/native-maestro-android.yml
    with:
      apk_artifact_name: native-regtest-apk
