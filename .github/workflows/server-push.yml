name: Master Server Build and Push

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "server/**"
      - "fly/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - ".railway/**"
      - ".dockerignore"
      - ".github/workflows/server.yml"
      - ".github/workflows/server-push.yml"
      - "!.railway/*.test.mjs"
      - "!fly/barkd.Dockerfile"
      - "!fly/barkd-entrypoint.sh"
      - "!fly/*.barkd.fly.toml"
      - "!**/*.md"

jobs:
  server-checks:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/server.yml

  server-build-and-push:
    strategy:
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2404
            platform: linux/amd64
            arch: amd64
          - runner: blacksmith-4vcpu-ubuntu-2404-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 🏗 Checkout code
        uses: actions/checkout@v6

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 Build and push ${{ matrix.arch }}
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/smolcars/noah-server:latest-${{ matrix.arch }}
            ghcr.io/smolcars/noah-server:sha-${{ github.sha }}-${{ matrix.arch }}
            ${{ secrets.DOCKERHUB_USERNAME }}/noah-server:latest-${{ matrix.arch }}
            ${{ secrets.DOCKERHUB_USERNAME }}/noah-server:sha-${{ github.sha }}-${{ matrix.arch }}

  create-manifest:
    needs: server-build-and-push
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      signet_image: ${{ steps.image.outputs.image }}
    steps:
      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🎯 Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/smolcars/noah-server:latest \
            -t ghcr.io/smolcars/noah-server:sha-${{ github.sha }} \
            ghcr.io/smolcars/noah-server:sha-${{ github.sha }}-amd64 \
            ghcr.io/smolcars/noah-server:sha-${{ github.sha }}-arm64

          docker buildx imagetools create \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/noah-server:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/noah-server:sha-${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/noah-server:sha-${{ github.sha }}-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/noah-server:sha-${{ github.sha }}-arm64

      - name: Resolve the signet image built by this commit
        id: image
        if: github.ref == 'refs/heads/master'
        run: |
          digest=$(docker buildx imagetools inspect "niteshbalusu/noah-server:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=niteshbalusu/noah-server@$digest" >> "$GITHUB_OUTPUT"

  railway-signet-deploy:
    name: Deploy signet API to Railway
    needs: [server-checks, create-manifest]
    if: github.ref == 'refs/heads/master'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    concurrency:
      group: railway-signet-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Skip a build superseded by a newer signet build
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/server-push.yml/runs?branch=master&event=push&per_page=1" --jq '.workflow_runs[0].id')
          [[ "$latest" =~ ^[0-9]+$ ]]
          if [[ "$latest" == "$GITHUB_RUN_ID" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded build $GITHUB_RUN_ID (newest: $latest)"
          fi
      - uses: actions/setup-node@v6
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: '24'
      - name: Install pinned Railway CLI
        if: steps.current.outputs.deploy == 'true'
        run: npm install --global @railway/cli@5.71.0
      - name: Install the IaC SDK
        if: steps.current.outputs.deploy == 'true'
        run: |
          sdk_version=$(node -p 'require("./package.json").devDependencies.railway')
          npm install --prefix "$RUNNER_TEMP/noah-railway-sdk" --ignore-scripts --no-package-lock "railway@$sdk_version"
          ln -s "$RUNNER_TEMP/noah-railway-sdk/node_modules" node_modules
      - name: Release the API image through railway.ts
        if: steps.current.outputs.deploy == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_SIGNET_TOKEN }}
          SIGNET_RELEASE_IMAGE: ${{ needs.create-manifest.outputs.signet_image }}
        run: |
          node .railway/release.mjs api "$SIGNET_RELEASE_IMAGE"
          curl --fail --silent --show-error https://signet.noahwallet.io/health

  mainnet-fly-deploy:
    name: Deploy mainnet to Fly
    needs: create-manifest
    if: >-
      ${{ !cancelled() && needs.create-manifest.result == 'success' &&
          github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    concurrency: fly-mainnet-deploy
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl config validate --strict --config fly/mainnet.fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_MAINNET_API_TOKEN }}
      - run: flyctl deploy --config fly/mainnet.fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_MAINNET_API_TOKEN }}
