name: Native iOS CI

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "apps/fixtures/**"
      - "api/openapi.json"
      - "client/assets/btcmap/places.btcmap"
      - "client/assets/geonames/cities.geonames"
      - "client/ios/SharedAppIntents/NoahAppIntents.swift" # AppIntentTests compares against it
      - ".github/workflows/native-ios.yml"
      - "!**/*.md"
  # Merges run the same checks; native-telegram-ios.yml builds signet and mainnet.
  push:
    branches: [master]
    paths:
      - "apps/ios/**"
      - "apps/fixtures/**"
      - "api/openapi.json"
      - "client/assets/btcmap/places.btcmap"
      - "client/assets/geonames/cities.geonames"
      - "client/ios/SharedAppIntents/NoahAppIntents.swift" # AppIntentTests compares against it
      - ".github/workflows/native-ios.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the old run; master runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Merges save caches and PRs restore them, so a PR doesn't evict master's entries.
  # Manual runs on other branches (such as bot/native-translations) restore like a PR.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/master' }}

jobs:
  build-and-test:
    runs-on: blacksmith-6vcpu-macos-27
    timeout-minutes: 25
    env:
      NATIVE_IOS_TEMP: /private/tmp/noah-native-ci
    steps:
      - uses: actions/checkout@v6

      # Xcode 26's Swift 6.3 crashes in IRGen on this app (40191514718); use the newest Xcode 27.
      - name: Select Xcode 27
        id: toolchain
        run: |
          shopt -s nullglob
          xcodes=(/Applications/Xcode_27*.app)
          xcode=$(printf '%s\n' "${xcodes[@]}" | sort -V | tail -1)
          export DEVELOPER_DIR="${xcode:-$(xcode-select -p | sed 's|/Contents/Developer$||')}/Contents/Developer"
          version=$(xcodebuild -version)
          echo "$version"
          if [[ "$version" != "Xcode 27"* ]]; then
            echo "::error::Xcode 27 is missing; installed: $(echo /Applications/Xcode*.app)"
            exit 1
          fi
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "xcode=$(awk '/Build version/ {print $3}' <<< "$version")" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      # Only the git clones: the 3.6 GB of binary artifacts (mostly Sentry) download faster than they restore.
      - name: Cache Swift package clones
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/ios/build/SourcePackages/repositories
          key: native-ios-spm-repositories-${{ hashFiles('apps/ios/Noah.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Merges build cold and save, so the cache holds only the latest master build (~650 MB).
      - name: Restore Xcode compilation cache
        if: env.SAVE_CACHE != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.NATIVE_IOS_TEMP }}/CompilationCache.noindex
          key: native-ios-cas-v1-${{ steps.toolchain.outputs.xcode }}-${{ github.sha }}
          restore-keys: native-ios-cas-v1-${{ steps.toolchain.outputs.xcode }}-

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      # It boots while the app builds; xcodebuild waits for it.
      - name: Create test simulator
        run: |
          mkdir -p "$NATIVE_IOS_TEMP"
          runtime=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and
                      any(d["identifier"] == "com.apple.CoreSimulator.SimDeviceType.iPhone-17"
                          for d in r.get("supportedDeviceTypes", []))]
          print(max(runtimes, key=lambda r: tuple(map(int, r["version"].split("."))))["identifier"])
          ')
          xcrun simctl create "Noah CI" com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$runtime" > "$NATIVE_IOS_TEMP/simulator-id"
          xcrun simctl boot "$(cat "$NATIVE_IOS_TEMP/simulator-id")"

      # PRs build only Noah-Regtest; a concrete simulator destination builds arm64 only.
      - name: Build and run NoahTests
        working-directory: apps/ios
        run: |
          simulator_id=$(cat "$NATIVE_IOS_TEMP/simulator-id")
          # Ad hoc simulator signing gives keychain tests their entitlements without secrets.
          xcodebuild -project Noah.xcodeproj -scheme Noah-Regtest \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/apps/ios/build/SourcePackages" \
            -derivedDataPath "$NATIVE_IOS_TEMP/DerivedData" \
            -parallel-testing-enabled NO -only-testing:NoahTests \
            -resultBundlePath "$NATIVE_IOS_TEMP/NoahTests.xcresult" \
            COMPILATION_CACHE_ENABLE_CACHING=YES "COMPILATION_CACHE_CAS_PATH=$NATIVE_IOS_TEMP/CompilationCache.noindex" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES test

      - name: Save Xcode compilation cache
        if: env.SAVE_CACHE == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.NATIVE_IOS_TEMP }}/CompilationCache.noindex
          key: native-ios-cas-v1-${{ steps.toolchain.outputs.xcode }}-${{ github.sha }}

      - name: Summarize test results
        if: always()
        run: |
          if [[ -d "$NATIVE_IOS_TEMP/NoahTests.xcresult" ]]; then
            xcrun xcresulttool get test-results summary --path "$NATIVE_IOS_TEMP/NoahTests.xcresult" > "$NATIVE_IOS_TEMP/NoahTests-summary.json"
          fi

      - name: Upload XCTest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ios-xcresult
          path: |
            ${{ env.NATIVE_IOS_TEMP }}/NoahTests.xcresult
            ${{ env.NATIVE_IOS_TEMP }}/NoahTests-summary.json
          if-no-files-found: error
          retention-days: 7
