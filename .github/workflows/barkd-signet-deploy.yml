name: Barkd Signet Railway Deploy

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Reviewed noah-barkd image digest (sha256:...)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy signet Barkd
    if: github.ref == 'refs/heads/master'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    concurrency:
      group: railway-signet-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.71.0
      - name: Deploy the reviewed image on the existing wallet volume
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_SIGNET_TOKEN }}
          DIGEST: ${{ inputs.image_digest }}
        run: |
          test -n "$RAILWAY_TOKEN"
          python3 .railway/deploy.py barkd "niteshbalusu/noah-barkd@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
