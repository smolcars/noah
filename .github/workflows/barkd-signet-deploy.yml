name: Barkd Signet Railway Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy signet Barkd
    if: github.ref == 'refs/heads/master'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    concurrency:
      group: railway-signet-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.71.0
      - name: Deploy the reviewed Barkd image on the existing volume
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_SIGNET_TOKEN }}
          RAILWAY_PROJECT: 8847a6a1-bf07-4321-a62b-9839e9954e46
          RAILWAY_ENVIRONMENT: 37880684-30ae-4242-af12-ddba1ba620ad
          RAILWAY_SERVICE: 0250c7b1-1916-44e0-81e7-afc947c4c5ad
        run: |
          test -n "$RAILWAY_TOKEN"
          railway up .railway/barkd --path-as-root --project "$RAILWAY_PROJECT" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE" --ci --message "$GITHUB_SHA"
