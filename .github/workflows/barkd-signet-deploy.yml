name: Barkd Signet Railway Deploy

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Reviewed niteshbalusu/noah-barkd@sha256:<digest> (check wallet compatibility and backup first)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy signet Barkd
    if: github.ref == 'refs/heads/master'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    concurrency:
      group: railway-signet-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.71.0
      - name: Install the IaC SDK
        run: |
          sdk_version=$(node -p 'require("./package.json").devDependencies.railway')
          npm install --prefix "$RUNNER_TEMP/noah-railway-sdk" --ignore-scripts --no-package-lock "railway@$sdk_version"
          ln -s "$RUNNER_TEMP/noah-railway-sdk/node_modules" node_modules
      - name: Release the reviewed Barkd image through railway.ts
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_SIGNET_TOKEN }}
          SIGNET_RELEASE_IMAGE: ${{ inputs.image }}
        run: |
          node .railway/release.mjs barkd "$SIGNET_RELEASE_IMAGE"
          curl --fail --silent --show-error https://signet.noahwallet.io/health
