name: Native Android Telegram (signet and mainnet)

on:
  push:
    branches: [master]
    paths:
      - "apps/android/**"
      - "apps/fixtures/**"
      - ".github/workflows/native-telegram-android.yml"
      - "!**/*.md"
  workflow_dispatch:
  # workflow_dispatch only works once this file is on master; until then, label a PR "send-to-telegram".
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  build:
    # Signing secrets: only this repo's own branches, never forks.
    if: github.event_name != 'pull_request' || (github.event.label.name == 'send-to-telegram' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # No Nix: Gradle needs only JDK 17, and the Sentry mapping upload needs sentry-cli.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Pinned and checksum-checked: it runs with the Sentry token in a job that holds the signing keys.
      - name: Install sentry-cli
        env:
          SENTRY_CLI_VERSION: 3.8.2
          SENTRY_CLI_SHA256: c958865f9d4000183509ea21b1f04925d5390de6d8d87386b9e69f2b305070c3
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/sentry-cli" "https://github.com/getsentry/sentry-cli/releases/download/$SENTRY_CLI_VERSION/sentry-cli-Linux-x86_64"
          echo "$SENTRY_CLI_SHA256  $RUNNER_TEMP/bin/sentry-cli" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/sentry-cli"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/sentry-cli" --version

      # Master writes the Gradle cache that Native Android CI restores on PRs.
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Locate Android SDK
        id: sdk
        run: echo "root=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

      - name: Cache Android build SDK
        id: sdk-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: native-android-sdk-${{ runner.os }}-${{ runner.arch }}-37.0-37.0.0
          path: |
            ${{ steps.sdk.outputs.root }}/platforms/android-37.0
            ${{ steps.sdk.outputs.root }}/build-tools/37.0.0

      - name: Install Android build SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'

      # Same keystore, alias and passwords as the RN signet distribution.
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}"
          : "${MYAPP_RELEASE_KEY_ALIAS:?Missing KEY_ALIAS}"
          : "${MYAPP_RELEASE_STORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          : "${MYAPP_RELEASE_KEY_PASSWORD:?Missing KEY_PASSWORD}"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/noah-signet-signing.XXXXXX")
          echo "SIGNING_DIR=$signing_dir" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.keystore"
          test -s "$signing_dir/release.keystore"
          export MYAPP_RELEASE_STORE_FILE="$signing_dir/release.keystore"
          python3 <<'PY'
          import os
          from pathlib import Path

          keys = ("STORE_FILE", "KEY_ALIAS", "STORE_PASSWORD", "KEY_PASSWORD")
          def escape(value):
              return value.replace("\\", "\\\\").replace("\r", "\\r").replace("\n", "\\n").replace(" ", "\\ ")
          Path("apps/android/local.properties").write_text("".join(
              f"MYAPP_RELEASE_{key}={escape(os.environ[f'MYAPP_RELEASE_{key}'])}\n"
              for key in keys
          ), encoding="iso-8859-1")
          PY

      # Same keystore as the RN signet and mainnet releases. Only phones install these, so arm64 only.
      # On master it also downloads the test libraries (without compiling) so the Gradle cache it saves covers PRs.
      - name: Build signed signet and mainnet release APKs
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: dunder-rn
          SENTRY_PROJECT: react-native
          CI_DEBUG_SIGNING: "false"
          TEST_LIBRARIES: ${{ github.ref == 'refs/heads/master' && '--init-script scripts/resolve-test-dependencies.init.gradle :app:resolveTestDependencies' || '' }}
        working-directory: apps/android
        # TEST_LIBRARIES is unquoted on purpose: it's empty, or an init script and a task.
        run: ./gradlew --build-cache --dependency-verification=strict -PnoahAbis=arm64-v8a :app:assembleSignetRelease :app:assembleMainnetRelease $TEST_LIBRARIES

      - name: Name APKs with commit
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          for flavor in signet mainnet; do
            cp "apps/android/app/build/outputs/apk/$flavor/release/app-$flavor-release.apk" \
              "noah-native-$flavor-${COMMIT_SHA}.apk"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: noah-native-android-${{ github.sha }}
          path: noah-native-*-${{ github.sha }}.apk
          if-no-files-found: error

      - name: Remove signing files
        if: always()
        run: |
          rm -f apps/android/local.properties
          if [[ -n "${SIGNING_DIR:-}" ]]; then
            rm -rf "$SIGNING_DIR"
          fi

  notify:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: noah-native-android-${{ github.sha }}

      # RN also uses a local Bot API server to support APKs over Telegram's public upload limit.
      - name: Start local Telegram Bot API server
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          docker run -d --name local-bot-api -p 127.0.0.1:8081:8081 \
            -v "$GITHUB_WORKSPACE:/data" -e TELEGRAM_API_ID -e TELEGRAM_API_HASH \
            aiogram/telegram-bot-api:latest --local
          for attempt in {1..30}; do
            if curl -s -o /dev/null http://localhost:8081/; then
              exit 0
            fi
            echo "Waiting for Telegram Bot API ($attempt/30)..."
            sleep 2
          done
          echo 'Telegram Bot API server did not start.' >&2
          exit 1

      - name: Post Native APKs to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BLIXT_CHAT_ID: ${{ secrets.BLIXT_CHAT_ID }}
          BLIXT_TOPIC_ID: ${{ secrets.BLIXT_TOPIC_ID }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # Same package and signing key as the RN app, so installing replaces it in place.
          for flavor in Signet Mainnet; do
            if [[ "$flavor" == Mainnet ]]; then
              headline='⚠️ MAINNET · REAL FUNDS · Noah Native preview · not the React Native app'
              warning='Installing replaces your React Native Noah mainnet app; going back needs a reinstall and wallet restore. Back up your recovery phrase first.'
            else
              headline='🧪 Noah Native preview (signet) · not the React Native app'
              warning='Installing replaces your React Native Noah Signet app; going back needs a reinstall and wallet restore.'
            fi
            printf '%s\n%s\n\nAndroid APK\nBranch: %s\nCommit: %s\n' "$headline" "$warning" "$BRANCH" "$COMMIT_SHA" > caption.txt
            curl -fsS -X POST "http://localhost:8081/bot${TELEGRAM_TOKEN}/sendDocument" \
              -F "chat_id=$BLIXT_CHAT_ID" -F "message_thread_id=$BLIXT_TOPIC_ID" \
              -F "document=@noah-native-$(tr '[:upper:]' '[:lower:]' <<< "$flavor")-${COMMIT_SHA}.apk" \
              -F 'caption=<caption.txt' -o "$RUNNER_TEMP/telegram.json"
            jq -e '.ok == true' "$RUNNER_TEMP/telegram.json" > /dev/null
          done

      - name: Stop local Telegram Bot API server
        if: always()
        run: docker rm -f local-bot-api
