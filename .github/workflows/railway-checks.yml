name: Railway deployment checks

on:
  pull_request:
    paths:
      - ".railway/**"
      - ".github/workflows/server*.yml"
      - ".github/workflows/barkd-signet-deploy.yml"
      - ".github/workflows/railway-checks.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test release behavior and preservation of image pins
        run: python3 -m unittest discover -s .railway -p 'test_*.py' -v
      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
          .github/workflows/server-push.yml .github/workflows/server.yml
          .github/workflows/barkd-signet-deploy.yml .github/workflows/railway-checks.yml
