name: Railway configuration checks

on:
  pull_request:
    paths:
      - .railway/**
      - .github/workflows/server-push.yml
      - .github/workflows/mainnet-railway-deploy.yml
      - .github/workflows/fly-mainnet-deploy.yml
      - .github/workflows/barkd-mainnet-deploy.yml
      - .github/workflows/railway-checks.yml
      - package.json
      - bun.lock

permissions:
  contents: read

jobs:
  railway_checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test ./.railway/tests/mainnet.test.js
      - name: Typecheck production bootstrap
        run: bun x --no-install tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck --types node .railway/mainnet/railway.ts
