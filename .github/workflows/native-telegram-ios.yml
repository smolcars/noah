name: Native iOS Telegram (signet and mainnet)

on:
  push:
    branches: [master]
    paths:
      - "apps/ios/**"
      - "apps/fixtures/**"
      - ".github/workflows/native-telegram-ios.yml"
      - "!**/*.md"
  workflow_dispatch:
  # workflow_dispatch only works once this file is on master; until then, label a PR "send-to-telegram".
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  NIX_CONFIG: |
    post-build-hook =
    extra-substituters =
    substituters = https://cache.nixos.org/

jobs:
  build:
    # Self-hosted with signing secrets: only this repo's own branches, never forks.
    if: github.event_name != 'pull_request' || (github.event.label.name == 'send-to-telegram' && github.event.pull_request.head.repo.full_name == github.repository)
    # Like ios-device-build.yml, use the existing runner's signing identity,
    # unlocked keychain and Xcode account/profiles for team AT26Z24V2Q.
    runs-on: macOS
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: signet, label: Signet, scheme: Noah-Signet, configuration: Release-Signet }
          - { flavor: mainnet, label: Mainnet, scheme: Noah, configuration: Release-Mainnet }
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Prepare temporary archive directory
        run: echo "IOS_TEMP=$(mktemp -d /private/tmp/noah-${{ matrix.flavor }}-ci-XXXXXX)" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Archive ${{ matrix.scheme }}
        working-directory: apps/ios
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: dunder-rn
          SENTRY_PROJECT: react-native
        run: |
          nix shell --inputs-from ../.. nixpkgs#sentry-cli --command xcodebuild \
            -project Noah.xcodeproj -scheme "${{ matrix.scheme }}" -configuration "${{ matrix.configuration }}" \
            -destination 'generic/platform=iOS' -jobs 2 -allowProvisioningUpdates \
            -derivedDataPath "$IOS_TEMP/DerivedData" \
            -archivePath "$IOS_TEMP/Noah.xcarchive" archive

      - name: Export ad-hoc IPA
        run: |
          cat > "$IOS_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>AT26Z24V2Q</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -allowProvisioningUpdates \
            -archivePath "$IOS_TEMP/Noah.xcarchive" \
            -exportOptionsPlist "$IOS_TEMP/ExportOptions.plist" \
            -exportPath "$IOS_TEMP/export"
          cp "$IOS_TEMP/export/Noah.ipa" "$IOS_TEMP/noah-native-${{ matrix.flavor }}.ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: noah-native-${{ matrix.flavor }}-ios-${{ github.sha }}
          path: ${{ env.IOS_TEMP }}/noah-native-${{ matrix.flavor }}.ipa
          if-no-files-found: error

      - name: Remove archive and DerivedData
        if: always() && env.IOS_TEMP != ''
        run: rm -rf "$IOS_TEMP"

  notify:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: signet, scheme: Noah-Signet, configuration: Release-Signet }
          - { flavor: mainnet, scheme: Noah, configuration: Release-Mainnet }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: noah-native-${{ matrix.flavor }}-ios-${{ github.sha }}

      - name: Upload IPA to Diawi and wait for download link
        id: diawi
        env:
          DIAWI_TOKEN: ${{ secrets.DIAWI_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST https://upload.diawi.com/ \
            -F "token=$DIAWI_TOKEN" -F 'file=@noah-native-${{ matrix.flavor }}.ipa')
          job=$(jq -er '.job | select(type == "string" and length > 0)' <<< "$response")
          echo "::add-mask::$job"
          for attempt in {1..30}; do
            response=$(curl -fsS --get https://upload.diawi.com/status \
              --data-urlencode "token=$DIAWI_TOKEN" --data-urlencode "job=$job")
            status=$(jq -er '.status' <<< "$response")
            case "$status" in
              2000)
                link=$(jq -er '.link | select(startswith("https://"))' <<< "$response")
                echo "link=$link" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              2001) echo "Waiting for Diawi ($attempt/30)..."; sleep 2 ;;
              *) echo "Diawi processing failed (status $status)." >&2; exit 1 ;;
            esac
          done
          echo 'Timed out waiting for Diawi.' >&2
          exit 1

      - name: Post Native Diawi link to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BLIXT_CHAT_ID: ${{ secrets.BLIXT_CHAT_ID }}
          BLIXT_TOPIC_ID: ${{ secrets.BLIXT_TOPIC_ID }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          DIAWI_LINK: ${{ steps.diawi.outputs.link }}
          FLAVOR: ${{ matrix.flavor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # workflow_dispatch has no head_commit, so look the message up.
          if [[ -z "$COMMIT_MESSAGE$PR_TITLE" ]]; then
            COMMIT_MESSAGE=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq .commit.message)
            export COMMIT_MESSAGE
          fi
          # Same bundle ID as the RN app, so installing replaces it in place.
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          def change_summary():
              pr_title = os.environ["PR_TITLE"].strip()
              if pr_title:
                  return f"{pr_title} (#{os.environ['PR_NUMBER']})"
              message = os.environ["COMMIT_MESSAGE"].strip()
              first, _, body = message.partition("\n")
              merge = re.fullmatch(r"Merge pull request #(\d+) from \S+", first)
              if merge and body.strip():
                  return f"{body.strip()} (#{merge[1]})"
              return message or "(no commit message)"

          def fit(head, change, footer, limit):
              # Telegram counts UTF-16 code units.
              size = lambda text: len(text.encode("utf-16-le")) // 2
              text = change
              while size(head + text + footer) > limit:
                  text = text[:-2] + "…"
              return head + text + footer

          disclaimers = {
              "signet": "🧪 Noah Native · Signet · iOS\nReplaces the React Native Signet app; going back needs a reinstall and restore.",
              "mainnet": "⚠️ Noah Native · MAINNET, real funds · iOS\nReplaces the React Native mainnet app; going back needs a reinstall and restore. Back up your recovery phrase first.",
          }
          head = f"{disclaimers[os.environ['FLAVOR']]}\nDownload: {os.environ['DIAWI_LINK']}\n\nWhat's new:\n"
          footer = f"\n\nCommit {os.environ['COMMIT_SHA'][:7]} on {os.environ['BRANCH']}"
          # Telegram messages allow 4096 characters.
          Path("message.txt").write_text(fit(head, change_summary(), footer, 4096), encoding="utf-8")
          PY
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -F "chat_id=$BLIXT_CHAT_ID" -F "message_thread_id=$BLIXT_TOPIC_ID" \
            -F 'text=<message.txt' -o "$RUNNER_TEMP/telegram.json"
          jq -e '.ok == true' "$RUNNER_TEMP/telegram.json" > /dev/null
