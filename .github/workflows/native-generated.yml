name: Native API drift

on:
  pull_request:
    paths:
      - "apps/ios/Noah/**"
      - "apps/ios/NoahWidget/**"
      - "apps/ios/Tools/OpenAPIGenerator/**"
      - "apps/android/app/src/main/**"
      - "apps/android/tools/**"
      - "apps/fixtures/**"
      - "apps/i18n/**"
      - "apps/tools/**"
      - "client/gt.config.json"
      - "package.json"
      - "bun.lock"
      - "api/**"
      - "server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - ".github/workflows/native-generated.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the old run; master runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No Nix: the copy checks need only Bun, and the client generators need Swift, Java 17, Python and just.

jobs:
  server-contract:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      # These exports are offline tests; no Postgres, Redis or wallet stack is needed.
      - name: Regenerate server contract and notification fixtures
        run: UPDATE_OPENAPI=1 cargo test -p server --bin server openapi::export

      - name: Check server contract drift
        run: |
          git diff --exit-code -- api/openapi.json apps/fixtures/server-notification-data.json
          test -z "$(git ls-files --others --exclude-standard -- api/openapi.json apps/fixtures/server-notification-data.json)"

  # Plain JavaScript, so a free runner with the latest Bun.
  native-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install locked Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test translation generator
        run: bun test apps/tools/translations.test.mjs

      - name: Check native translation drift and single-platform copy
        run: bun apps/tools/translations.mjs --check

      - name: Check native log output boundary
        run: bun apps/tools/check-log-output.mjs

  # Independent of server-contract: this checks the clients against the committed api/openapi.json.
  # macOS for the Swift generator; the Kotlin one is a Java jar run by Python.
  native-clients:
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Check runner default Swift
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          swift --version

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install just
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just

      - name: Cache Swift generator
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/ios/Tools/OpenAPIGenerator/.build
          key: native-api-swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/ios/Tools/OpenAPIGenerator/Package.*') }}

      - name: Regenerate native clients
        run: just generate-api-ios generate-api-android

      - name: Check native client drift
        run: |
          git diff --exit-code -- apps/ios/Noah/API/Generated apps/android/app/src/main/java/com/noahwallet/api/generated
          test -z "$(git ls-files --others --exclude-standard -- apps/ios/Noah/API/Generated apps/android/app/src/main/java/com/noahwallet/api/generated)"
