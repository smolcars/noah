name: Build iOS Release Simulator App

env:
  # Restore the Nix store explicitly; use the public binary cache on cache misses.
  NIX_CONFIG: |
    post-build-hook =
    extra-substituters =
    substituters = https://cache.nixos.org/

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "The name of the uploaded artifact"
        value: ${{ jobs.build-release-ios.outputs.artifact_name }}
      app_filename:
        description: "The filename of the iOS app"
        value: ${{ jobs.build-release-ios.outputs.app_filename }}

jobs:
  build-release-ios:
    name: Build iOS Release App
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.set_outputs.outputs.artifact_name }}
      app_filename: ${{ steps.set_outputs.outputs.app_filename }}
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v6

      - name: Check runner default Xcode
        id: toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          echo "macos=$(sw_vers -buildVersion)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Restore Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.macos }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.macos }}-${{ steps.toolchain.outputs.xcode }}-

      - name: Prepare iOS CI environment
        run: /usr/bin/time -p nix build .#devShells.aarch64-darwin.ios-ci --no-link

      - name: 📦 Install dependencies
        run: nix develop .#ios-ci --command bash -c "bun install --frozen-lockfile"

      - name: Restore Pods and native dependency downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            client/ios/Pods
            ~/.cocoapods/repos
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/ReactNative
          key: ios-pods-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.macos }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('flake.nix', 'flake.lock', 'bun.lock', 'package.json', 'client/package.json', 'client/ios/Podfile', 'client/ios/Podfile.lock', 'client/ios/Podfile.properties.json', 'patches/**') }}

      - name: Install iOS Pods
        run: /usr/bin/time -p nix develop .#ios-ci --command bun client ios:prebuild

      - name: Restore Xcode compilation cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: client/ios/build/CompilationCache.noindex
          # Each successful run saves a new snapshot so the compiler cache keeps warming.
          key: ios-compilation-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.macos }}-${{ steps.toolchain.outputs.xcode }}-regtest-release-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-compilation-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.macos }}-${{ steps.toolchain.outputs.xcode }}-regtest-release-

      - name: 🛠️ Build
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          /usr/bin/time -p nix develop .#ios-ci --command bun client build:ios:ci \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            "COMPILATION_CACHE_CAS_PATH=$GITHUB_WORKSPACE/client/ios/build/CompilationCache.noindex" \
            -showBuildTimingSummary

      - name: 📁 Prepare build output
        id: set_outputs
        run: |
          mkdir ios-release-build
          mv client/ios/build/Build/Products/Release-iphonesimulator/Noah-Regtest.app ios-release-build/ios-release.app
          echo "artifact_name=ios-release-app" >> "$GITHUB_OUTPUT"
          echo "app_filename=ios-release.app" >> "$GITHUB_OUTPUT"

      - name: 🗜️ Compress iOS app
        run: |
          cd ios-release-build
          zip -r -y ios-release.zip ios-release.app
          rm -rf ios-release.app

      - name: 📤 Upload iOS app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.set_outputs.outputs.artifact_name }}
          path: ios-release-build/ios-release.zip
          if-no-files-found: error
          overwrite: true
