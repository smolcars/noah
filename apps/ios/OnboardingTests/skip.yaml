appId: com.noahwallet.regtest
---
- assertVisible: Pick a name
- takeScreenshot: ${SHOTS}/name
- tapOn:
    id: onboarding-name-skip
- extendedWaitUntil:
    visible: Add your email
    timeout: 30000
- tapOn:
    id: email-address-input
- inputText: se@gmial.com
- assertVisible: Did you mean
- takeScreenshot: ${SHOTS}/email-typo
- tapOn: se@gmail.com
- extendedWaitUntil:
    visible:
      id: onboarding-email-send
      enabled: true
    timeout: 10000
- tapOn:
    id: onboarding-email-send
- extendedWaitUntil:
    visible: Check your email
    timeout: 30000
- takeScreenshot: ${SHOTS}/code
- tapOn:
    id: onboarding-email-edit
- assertVisible:
    id: email-address-input
- tapOn:
    id: onboarding-email-skip
- extendedWaitUntil:
    visible: Keep Noah awake
    timeout: 30000
- tapOn:
    id: notifications-enable
- extendedWaitUntil:
    visible: You’re all set
    timeout: 30000
- assertVisible: Your wallet is ready.
- tapOn:
    id: onboarding-open-wallet
- extendedWaitUntil:
    visible: Add Emergency Email
    timeout: 30000
- assertVisible:
    id: home-backup-prompt
- takeScreenshot: ${SHOTS}/home-banner
- tapOn: Add Emergency Email
- assertVisible: Emergency Email
- tapOn: Back
- tapOn: Dismiss emergency email prompt
- assertNotVisible: Add Emergency Email
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-backup-prompt
    timeout: 60000
- assertNotVisible: Add Emergency Email
