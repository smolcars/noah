appId: com.noahwallet.regtest
---
- assertVisible: Pick a name
- tapOn:
    id: lightning-username-input
- inputText: ${USERNAME}
- extendedWaitUntil:
    visible: Available
    timeout: 15000
- takeScreenshot: ${SHOTS}/name
- tapOn:
    id: onboarding-name-continue
- extendedWaitUntil:
    visible: Add your email
    timeout: 30000
- tapOn:
    id: email-address-input
- inputText: ${EMAIL}
# The keyboard's Send key submits; tapping the button right after inputText can hit a
# pre-keyboard frame that Maestro cached during the same run.
- pressKey: Enter
- extendedWaitUntil:
    visible: Check your email
    timeout: 30000
- takeScreenshot: ${SHOTS}/code
- inputText: '000001'
- extendedWaitUntil:
    visible: That code didn’t work. Try again.
    timeout: 15000
- inputText: '000000'
- extendedWaitUntil:
    visible: Keep Noah awake
    timeout: 30000
- tapOn:
    id: notifications-enable
- extendedWaitUntil:
    visible: You’re all set
    timeout: 30000
- assertVisible: ${USERNAME}@.*
- tapOn:
    id: onboarding-open-wallet
- extendedWaitUntil:
    visible:
      id: home-backup-prompt
    timeout: 30000
- assertNotVisible: Add Emergency Email
- takeScreenshot: ${SHOTS}/home
# The Nostr key moved from onboarding to Settings → Profile → Edit Lightning Address.
- tapOn:
    id: home-settings-button
- tapOn:
    id: settings-profile
- tapOn: Edit Lightning Address
- scrollUntilVisible:
    element:
      id: nostr-public-key-input
    direction: DOWN
- tapOn:
    id: nostr-public-key-input
- inputText: nsec1test
- tapOn: Done
- tapOn: Save
- assertVisible: Never paste a Nostr private key. Enter an npub public key.
- tapOn: OK
- tapOn:
    id: nostr-public-key-input
- eraseText: 100
- inputText: npub1kp34665c28f6a5xdd3y4k2ppv7k0wctjjpudja0uxsdjyegtq7us853d4g
- tapOn: Done
- tapOn: Save
# The editor confirms, then returns to Profile, which now lists the key.
- extendedWaitUntil:
    visible: Edit Lightning Address
    timeout: 30000
- scrollUntilVisible:
    element: Nostr Public Key
    direction: DOWN
