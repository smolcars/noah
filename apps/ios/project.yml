name: Noah

options:
  bundleIdPrefix: com.noahwallet
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  defaultConfig: Debug-Regtest

configs:
  Debug-Mainnet: debug
  Release-Mainnet: release
  Debug-Signet: debug
  Release-Signet: release
  Debug-Regtest: debug
  Release-Regtest: release

configFiles:
  Debug-Mainnet: Config/Mainnet.xcconfig
  Release-Mainnet: Config/Mainnet.xcconfig
  Debug-Signet: Config/Signet.xcconfig
  Release-Signet: Config/Signet.xcconfig
  Debug-Regtest: Config/Regtest.xcconfig
  Release-Regtest: Config/Regtest.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: AT26Z24V2Q
    CODE_SIGN_STYLE: Automatic
    # Must stay above the React Native app's 0.1.14 (38) so the native app installs as an update.
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 100
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO # apps/tools/translations.mjs owns the catalog deterministically.

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.29.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
  BarkBoltFFI:
    url: https://github.com/smolcars/bark-bolt-ffi
    exactVersion: 0.7.0
  # Same MMKV core line (2.4.x) as react-native-mmkv 4.3.2, so the native app
  # opens the RN app's `noah-wallet-storage` file as-is.
  MMKV:
    url: https://github.com/Tencent/MMKV
    exactVersion: 2.4.3
  # Same version the RN app's noah-tools used for .noahbackup archives.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
  # Runtime for the client generated from api/openapi.json (see Noah/API).
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    exactVersion: 1.13.2
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    exactVersion: 1.3.2

targets:
  Noah:
    type: application
    platform: iOS
    sources:
      - path: Noah
        excludes:
          - API/openapi-generator-config.yaml
          - Resources/Localizable.xcstrings
      - path: Noah/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: ../../client/assets/btcmap/places.btcmap
        buildPhase: resources
      - path: ../../client/assets/geonames/cities.geonames
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Noah
        PRODUCT_BUNDLE_IDENTIFIER: $(NOAH_BUNDLE_ID)
        INFOPLIST_FILE: Noah/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Noah/Resources/Noah.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: noah
        # sentry-cli needs network and dSYM access during device archives.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    postBuildScripts:
      - name: Upload Debug Symbols to Sentry
        path: Scripts/upload-sentry-symbols.sh
        basedOnDependencyAnalysis: false
        showEnvVars: false
        # The DWARF file, not the bundle dir, orders this after GenerateDSYMFile (Sentry's documented input).
        inputFiles:
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(EXECUTABLE_NAME)
    info:
      path: Noah/Resources/Info.plist
      properties:
        NoahAppVariant: "$(NOAH_APP_VARIANT)"
        NoahAppGroup: "$(NOAH_APP_GROUP)"
        NoahSentryDSN: "$(NOAH_SENTRY_DSN)"
        NoahRegtestHost: "$(NOAH_REGTEST_HOST)"
        NoahRegtestServerURL: "$(NOAH_REGTEST_SERVER_URL)"
        NoahRegtestArkURL: "$(NOAH_REGTEST_ARK_URL)"
        NoahRegtestBitcoindURL: "$(NOAH_REGTEST_BITCOIND_URL)"
        NSLocalNetworkUsageDescription: "$(NOAH_DISPLAY_NAME) uses your local network only to reach a development server on your computer."
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleDisplayName: "$(NOAH_DISPLAY_NAME)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleURLTypes: [{"CFBundleURLSchemes": ["$(NOAH_URL_SCHEME)"]}, {"CFBundleURLSchemes": ["bitcoin", "lightning", "lnurlp"]}]
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationQueriesSchemes: ["whatsapp", "telegram", "signal"]
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity: {"NSAllowsArbitraryLoads": false, "NSAllowsLocalNetworking": true}
        NSCameraUsageDescription: "$(NOAH_DISPLAY_NAME) needs access to your Camera."
        NSFaceIDUsageDescription: "Allow $(NOAH_DISPLAY_NAME) to use Face ID."
        NSLocationWhenInUseUsageDescription: "Allow $(NOAH_DISPLAY_NAME) to use your location to find nearby places that accept bitcoin."
        NSPhotoLibraryUsageDescription: "Allow $(NOAH_DISPLAY_NAME) to access your photos so that you can pick screenshots to share feedback."
        UIAppFonts: ["Inter-Regular.ttf", "Inter-Medium.ttf", "Inter-SemiBold.ttf", "Inter-Bold.ttf", "SpaceGrotesk-Medium.ttf", "SpaceGrotesk-SemiBold.ttf"]
        UIApplicationSceneManifest: {"UIApplicationSupportsMultipleScenes": false}
        UILaunchScreen: {"UIColorName": "SplashScreenBackground", "UIImageName": "SplashScreenLogo"}
        UIRequiredDeviceCapabilities: ["arm64"]
        UISupportedInterfaceOrientations: ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationPortraitUpsideDown", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
        UISupportedInterfaceOrientations~ipad: ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationPortraitUpsideDown", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
        UIBackgroundModes: [remote-notification, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
          - $(PRODUCT_BUNDLE_IDENTIFIER).maintenance
    dependencies:
      - target: NoahWidget
      - package: Sentry
        product: Sentry
      - package: MapLibre
        product: MapLibre
      - package: BarkBoltFFI
        product: BarkBoltFFI
      - package: MMKV
        product: MMKV
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: OpenAPIURLSession
        product: OpenAPIURLSession
      - package: ZIPFoundation
        product: ZIPFoundation

  NoahWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NoahWidget
        excludes:
          - Entitlements
      # The app's catalog and lookup, so the widget shows the app's language.
      - path: Noah/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Noah/Localization/L10n.swift
      - path: Noah/Services/Storage/LegacyLocale.swift
      # The snapshot, its wave and texts, Home's amounts and the design tokens and fonts.
      - path: Noah/Widget
      - path: Noah/Formatting/BitcoinAmount.swift
      - path: Noah/Formatting/FiatCurrency.swift
      - path: Noah/DesignSystem/NoahTokens.swift
      - path: Noah/Resources/Fonts/SpaceGrotesk-Medium.ttf
        buildPhase: resources
      - path: Noah/Resources/Fonts/SpaceGrotesk-SemiBold.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: NoahWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(NOAH_WIDGET_BUNDLE_ID)
        INFOPLIST_FILE: NoahWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: NoahWidget/Entitlements/$(NOAH_VARIANT_NAME).entitlements
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  NoahTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NoahTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NOAH_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Noah

schemes:
  Noah:
    build:
      targets:
        Noah: all
        NoahTests: [test]
    run:
      config: Debug-Mainnet
    test:
      config: Debug-Mainnet
      targets: [NoahTests]
    profile:
      config: Release-Mainnet
    analyze:
      config: Debug-Mainnet
    archive:
      config: Release-Mainnet

  Noah-Signet:
    build:
      targets:
        Noah: all
        NoahTests: [test]
    run:
      config: Debug-Signet
    test:
      config: Debug-Signet
      targets: [NoahTests]
    profile:
      config: Release-Signet
    analyze:
      config: Debug-Signet
    archive:
      config: Release-Signet

  Noah-Regtest:
    build:
      targets:
        Noah: all
        NoahTests: [test]
    run:
      config: Debug-Regtest
    test:
      config: Debug-Regtest
      targets: [NoahTests]
    profile:
      config: Release-Regtest
    analyze:
      config: Debug-Regtest
    archive:
      config: Release-Regtest
