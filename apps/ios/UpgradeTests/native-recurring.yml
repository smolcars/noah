appId: com.noahwallet.regtest
---
- launchApp
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- assertVisible: "Show balance"
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Recurring Payments.*"
    direction: DOWN
- tapOn: "Recurring Payments.*"
- extendedWaitUntil:
    visible: "No recurring payments yet.*"
    timeout: 15000
- assertNotVisible: "Upgrade safety rule"
