appId: com.noahwallet.regtest
---
- launchApp
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- assertVisible: "Show balance"
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Recurring Payments.*"
    direction: DOWN
- tapOn: "Recurring Payments.*"
- extendedWaitUntil:
    visible: "Upgrade safety rule"
    timeout: 15000
- assertVisible: "1,000 sats"
- assertVisible: "Monthly.*0 paid.*"
