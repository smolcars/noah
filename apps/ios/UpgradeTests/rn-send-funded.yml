# Type the public destination so shared simulator pasteboard sync cannot change it.
appId: com.noahwallet.regtest
---
- launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Send"
          timeout: 60000
- tapOn: "Send"
- extendedWaitUntil:
    visible:
      id: "send-amount-stage"
    timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ".*[1-9][0-9,]* available"
          timeout: 60000
- tapOn:
    id: "send-key-5"
- tapOn:
    id: "send-key-0"
- tapOn:
    id: "send-key-0"
- tapOn:
    id: "send-key-0"
- tapOn:
    id: "send-amount-next"
- tapOn:
    id: "send-recipient-input"
- inputText: ${DESTINATION}
- assertVisible:
    id: "send-recipient-input"
    text: ${DESTINATION}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "send-recipient-next"
- extendedWaitUntil:
    visible:
      id: "send-review-sheet"
    timeout: 30000
- assertVisible: "Ark"
- tapOn:
    id: "send-review-confirm"
- extendedWaitUntil:
    visible: "Payment sent"
    timeout: 30000
- assertVisible: "Completed"
