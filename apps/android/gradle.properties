org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Unit tests run on Java 21 (app/build.gradle.kts): the Nix shell exports JAVA21_HOME; CI's setup-java sets JAVA_HOME_21_*.
org.gradle.java.installations.fromEnv=JAVA21_HOME,JAVA_HOME_21_X64,JAVA_HOME_21_ARM64
org.gradle.java.installations.auto-download=false
