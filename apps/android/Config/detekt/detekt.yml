# Overrides on top of detekt's defaults (build-upon-default-config). ktlint owns layout.
complexity:
  LongParameterList:
    # Composables take state and callbacks as parameters by design.
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    ignoreSingleWhenExpression: true
naming:
  EnumNaming:
    # lowerCamel entries mirror the Swift enums.
    enumEntryPattern: '[a-zA-Z][_a-zA-Z0-9]*'
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
  ConstructorParameterNaming:
    privateParameterPattern: '_?[a-z][A-Za-z0-9]*'
style:
  MaxLineLength:
    maxLineLength: 160
    excludeCommentStatements: true
    excludeRawStrings: true
  MagicNumber:
    # Layout dimensions and fixture values are clearer inline.
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  ForbiddenComment:
    active: false
coroutines:
  GlobalCoroutineUsage:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
potential-bugs:
  DontDowncastCollectionTypes:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
exceptions:
  ObjectExtendsThrowable:
    active: true
