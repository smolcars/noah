[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose-bom = "2026.09.00"
material3 = "1.4.0"
navigation3 = "1.2.0"
activity = "1.13.0"
lifecycle = "2.11.0"
serialization = "1.11.0"
coroutines = "1.11.0"
okhttp = "5.5.0"
ktor = "3.6.0"
mmkv = "2.4.3"
firebase-bom = "35.0.2"
google-services = "4.5.0"
unifiedpush = "3.1.2"
work = "2.9.1"
bark-bolt = "0.7.0"
sentry = "8.57.0"
junit = "4.13.2"
datastore = "1.1.1"
security-crypto = "1.1.0"
androidx-test-runner = "1.6.2"
androidx-test-junit = "1.2.1"

[libraries]
window = { module = "androidx.window:window", version = "1.5.1" }
window-core = { module = "androidx.window:window-core", version = "1.5.1" }
compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
# NDK outbox replay passes through the JVM event filter; replay is excluded.
sentry-android-core = { module = "io.sentry:sentry-android-core", version.ref = "sentry" }
sentry-android-ndk = { module = "io.sentry:sentry-android-ndk", version.ref = "sentry" }
camera-core = { module = "androidx.camera:camera-core", version = "1.4.2" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version = "1.4.2" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version = "1.4.2" }
camera-view = { module = "androidx.camera:camera-view", version = "1.4.2" }
biometric = { module = "androidx.biometric:biometric", version = "1.1.0" }
fragment = { module = "androidx.fragment:fragment", version = "1.8.9" }
maplibre = { module = "org.maplibre.gl:android-sdk", version = "13.7.1" }
commons-compress = { module = "org.apache.commons:commons-compress", version = "1.28.0" }
zxing-core = { module = "com.google.zxing:core", version = "3.5.3" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
mmkv = { module = "com.tencent:mmkv", version.ref = "mmkv" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
robolectric = { module = "org.robolectric:robolectric", version = "4.17" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
unifiedpush = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush" }
bark-bolt = { module = "io.github.niteshbalusu11:bark-bolt-ffi-android", version.ref = "bark-bolt" }
junit = { module = "junit:junit", version.ref = "junit" }

datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
# Android 17 removed InputManager.getInstance, which Compose's transitive espresso-core 3.5 reflects on in every UI test.
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version = "3.7.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
