# Set the locale last, after every English RN selector has been used.
appId: com.noahwallet.regtest
---
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- tapOn: "Home"
- tapOn: "Open settings"
- tapOn:
    id: "settings-language"
- tapOn:
    id: "language-option-sv"
- stopApp
