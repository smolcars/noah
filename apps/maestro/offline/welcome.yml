appId: com.noahwallet.regtest
name: Offline welcome and beta navigation
---
# Retry only launch/clearing on a disposable wallet when ADB briefly reconnects.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
          permissions:
            all: allow
- assertVisible: "Welcome to Noah"
- tapOn: "Create Wallet"
- assertVisible: "Noah is in beta"
- runFlow: ../subflows/back.yml
- assertVisible: "Welcome to Noah"
- tapOn: "Create Wallet"
- tapOn: "I decline"
- assertVisible: "Welcome to Noah"
- tapOn: "Restore Wallet"
- assertVisible: "Restore Wallet"
- runFlow:
    when:
      platform: Android
    commands:
      # The embedded password EditText exposes its accessibility hint.
      - assertVisible: "Word 1"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: "restore-word-1"
