appId: com.noahwallet.regtest
---
- tapOn:
    id: "send-key-5"
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "send-key-0"
- assertVisible:
    id: "send-amount"
    text: "5000"
- scrollUntilVisible:
    element:
      id: "send-continue"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "send-continue"
- assertVisible:
    id: "send-recipient"
