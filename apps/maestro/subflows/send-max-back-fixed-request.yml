appId: com.noahwallet.regtest
name: Cancel MAX before a fixed amount request
---
- runFlow: reset-send.yml
- scrollUntilVisible:
    element:
      id: "send-max"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "send-max"
- assertVisible: "Choose balance"
- tapOn:
    id: "send-start-over"
- runFlow: paste-recipient.yml
- assertNotVisible: "MAX requires an on-chain address without a fixed amount."
- extendedWaitUntil:
    visible:
      id: "send-confirm"
    timeout: 30000
- tapOn:
    id: "send-review-back"
- assertVisible:
    id: "send-recipient"
