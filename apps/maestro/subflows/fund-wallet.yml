appId: com.noahwallet.regtest
---
# Funded job setup, run by scripts/test-maestro-native.sh, step 1 of 2: the job's wallet
# and its Ark address in the clipboard, which the script passes to the funded flows.
# fund-wallet-invoice.yml then puts a 10,000-sat Lightning invoice there for LND to pay.
- runFlow: create-wallet.yml
- tapOn: "Receive"
- tapOn:
    id: receive-formats
# The Ark row shows its address once Receive has a request; its copy button does nothing before.
- extendedWaitUntil:
    visible: "tark1.*"
    timeout: 20000
- tapOn:
    id: receive-copy-ark
- pressKey: BACK
