appId: com.noahwallet.regtest
name: Send 5000 sats over Ark
---
- runFlow: reset-send.yml
- extendedWaitUntil:
    visible: ".*[1-9][0-9]* sats available in Ark"
    timeout: 60000
- runFlow: enter-send-amount.yml
- runFlow: paste-recipient.yml
- extendedWaitUntil:
    visible:
      id: "send-confirm"
    timeout: 30000
- assertVisible: "Ark"
- tapOn:
    id: "send-confirm"
- extendedWaitUntil:
    visible: "Payment sent"
    timeout: 60000
- tapOn: "Done"
