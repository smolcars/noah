appId: com.noahwallet.regtest
name: Abandoned review does not reuse recipient
---
- launchApp
# Claim the incoming Ark transfer through the normal wallet sync gesture.
- tapOn: "Home"
- swipe:
    start: "50%,25%"
    end: "50%,80%"
    duration: 800
- tapOn: "Send"
- extendedWaitUntil:
    visible: ".*[1-9][0-9,]* sats available in Ark"
    timeout: 60000
- runFlow: reset-send.yml
- runFlow: enter-send-amount.yml
- runFlow: paste-recipient.yml
- extendedWaitUntil:
    visible:
      id: "send-review-back"
    timeout: 30000
- tapOn:
    id: "send-review-back"
- assertVisible:
    id: "send-recipient"
- tapOn:
    id: "send-start-over"
- tapOn:
    id: "send-key-4"
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "send-key-0"
- scrollUntilVisible:
    element:
      id: "send-continue"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "send-continue"
- assertVisible:
    id: "send-recipient"
- assertNotVisible:
    id: "send-confirm"
- assertNotVisible: ${DESTINATION}
