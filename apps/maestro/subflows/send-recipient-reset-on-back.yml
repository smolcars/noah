appId: com.noahwallet.regtest
name: Abandoned review does not reuse recipient
---
- runFlow: reset-send.yml
- runFlow: enter-send-amount.yml
- runFlow: paste-recipient.yml
- extendedWaitUntil:
    visible:
      id: "send-review-back"
    timeout: 30000
- tapOn:
    id: "send-review-back"
- assertVisible:
    id: "send-recipient"
- tapOn:
    id: "send-start-over"
- tapOn:
    id: "send-key-4"
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "send-key-0"
- tapOn:
    id: "send-continue"
- assertVisible:
    id: "send-recipient"
- assertNotVisible:
    id: "send-confirm"
- assertNotVisible: ${DESTINATION}
