appId: com.noahwallet.regtest
---
# Funded job setup, run by scripts/test-maestro-native.sh, step 2 of 2, on the wallet
# fund-wallet.yml left on Receive: a 10,000-sat Lightning invoice in the clipboard, which
# the script pays from LND. Only the invoice carries an amount; the payment request doesn't.
- tapOn:
    id: receive-amount-button
- tapOn:
    id: send-key-1
- repeat:
    times: 4
    commands:
      - tapOn:
          id: send-key-0
- tapOn:
    id: receive-amount-submit
- extendedWaitUntil:
    visible:
      id: receive-band
    timeout: 20000
- tapOn:
    id: receive-formats
- tapOn:
    id: receive-copy-invoice
- pressKey: BACK
