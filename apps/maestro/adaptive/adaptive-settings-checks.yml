appId: com.noahwallet.regtest
---
- tapOn:
    id: "home-settings-button"
- runFlow:
    file: ../subflows/scroll-primary-to-id.yml
    env:
      TARGET_ID: "settings-currency"
- tapOn:
    id: "settings-currency"
- runFlow:
    file: ../subflows/scroll-primary-to-id.yml
    env:
      TARGET_ID: "preference-EUR"
- tapOn:
    id: "preference-EUR"
- runFlow:
    file: ../subflows/scroll-primary-to-id.yml
    env:
      TARGET_ID: "settings-bitcoinUnit"
- tapOn:
    id: "settings-bitcoinUnit"
- tapOn:
    id: "preference-sats"
- runFlow:
    file: ../subflows/scroll-primary-up-to-id.yml
    env:
      TARGET_ID: "settings-profile"
- tapOn:
    id: "settings-profile"
- tapOn:
    id: "profile-name-input"
- inputText: "Foldable draft"
- assertVisible:
    id: "profile-name-input"
    text: "Foldable draft"
- takeScreenshot: adaptive-profile-draft
- runFlow: ../subflows/hide-keyboard.yml
- runFlow: ../subflows/back.yml
- runFlow:
    file: ../subflows/scroll-primary-to-id.yml
    env:
      TARGET_ID: "settings-backup"
- tapOn:
    id: "settings-backup"
- scrollUntilVisible:
    element: "List Backups"
    direction: DOWN
- takeScreenshot: adaptive-backup
- runFlow: ../subflows/back.yml
- runFlow:
    file: ../subflows/scroll-primary-up-to-id.yml
    env:
      TARGET_ID: "settings-emergencyExit"
- tapOn:
    id: "settings-emergencyExit"
- assertVisible: "Reading this screen and estimating fees never broadcasts an exit."
- takeScreenshot: adaptive-exit
- runFlow: ../subflows/back.yml
- runFlow:
    file: ../subflows/scroll-primary-up-to-id.yml
    env:
      TARGET_ID: "settings-vtxos"
- tapOn:
    id: "settings-vtxos"
- assertVisible: "VTXOs"
- takeScreenshot: adaptive-vtxos
- runFlow: ../subflows/back.yml
- runFlow:
    file: ../subflows/scroll-primary-to-id.yml
    env:
      TARGET_ID: "settings-board-ark"
- tapOn:
    id: "settings-board-ark"
- tapOn:
    id: "board-amount"
- inputText: "12345"
- assertVisible:
    id: "board-amount"
    text: "12345"
- runFlow: ../subflows/hide-keyboard.yml
- takeScreenshot: adaptive-board-draft
- runFlow: ../subflows/back.yml
- runFlow:
    file: ../subflows/scroll-primary-up-to-id.yml
    env:
      TARGET_ID: "settings-recurring-payments"
- tapOn:
    id: "settings-recurring-payments"
- tapOn:
    id: "recurring-new-button"
- tapOn:
    id: "recurring-label-input"
- inputText: "Layout schedule"
- runFlow: ../subflows/hide-keyboard.yml
- runFlow:
    file: ../subflows/scroll-primary-to-id.yml
    env:
      TARGET_ID: "recurring-save-button"
- takeScreenshot: adaptive-schedule-draft
- runFlow: ../subflows/back.yml
- runFlow: ../subflows/back.yml
- runFlow: ../subflows/back.yml
