appId: com.noahwallet.regtest
---
- tapOn:
    id: "home-settings-button"
- repeat:
    times: 3
    commands:
      - runFlow:
          file: ../subflows/scroll-primary-up-to-id.yml
          env:
            TARGET_ID: "settings-profile"
      - tapOn:
          id: "settings-profile"
      - tapOn:
          id: "profile-name-input"
      - eraseText: 80
      - inputText: "Rotation draft"
      - runFlow: ../subflows/hide-keyboard.yml
      - setOrientation: LANDSCAPE_LEFT
      - assertVisible:
          id: "profile-name-input"
          text: "Rotation draft"
      - setOrientation: PORTRAIT
      - assertVisible:
          id: "profile-name-input"
          text: "Rotation draft"
      - runFlow: ../subflows/back.yml
- runFlow: ../subflows/back.yml
