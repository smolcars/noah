appId: com.noahwallet.regtest
name: Onboarding and back navigation
---
# Retry only launch/clearing on a disposable wallet when ADB briefly reconnects.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
          permissions:
            all: allow
- tapOn: "Create Wallet"
- runFlow: subflows/back.yml
- assertVisible: "Welcome to Noah"
- tapOn: "Create Wallet"
- tapOn: "I decline"
- assertVisible: "Welcome to Noah"
- runFlow: subflows/start-wallet-onboarding.yml
# Native deliberately keeps the recovery-phrase boundary once created.
- repeat:
    times: 2
    commands:
      - runFlow: subflows/back.yml
      - assertVisible: "Your Recovery Phrase"
      - scrollUntilVisible:
          element: "I Have Saved It, Continue"
          direction: DOWN
      - tapOn: "I Have Saved It, Continue"
      - assertVisible: "Emergency Email"
- runFlow: subflows/complete-wallet-onboarding-without-email.yml
- stopApp
- retry:
    maxRetries: 2
    commands:
      - launchApp
- assertVisible:
    id: "home-settings-button"
