    clearState: true
    clearKeychain: true
- setOrientation: PORTRAIT
- runFlow: ../../.maestro/subflows/start-wallet-onboarding.yml
- runFlow: ../../.maestro/subflows/complete-wallet-onboarding-without-email.yml
- runFlow: adaptive-layout-checks.yml
