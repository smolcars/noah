# email-verification.yml

appId: com.noahwallet.regtest
---
- runScript: scripts/lightning-address.js

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: subflows/start-wallet-onboarding.yml

# Emergency Email screen
- extendedWaitUntil:
    visible: "Emergency Email"
    timeout: 10000
- tapOn:
    text: "your@email.com"
    optional: true
- inputText: "maestro@example.com"
- tapOn: "Send Verification Code"

# Verification Code screen
- extendedWaitUntil:
    visible: "Enter Verification Code"
    timeout: 10000
- inputText: "000000"
- tapOn: "Verify Email"

# Lightning Address screen
- extendedWaitUntil:
    visible: "Choose your Lightning Address"
    timeout: 10000
- tapOn:
    point: "50%,33%"
- eraseText: 40
- inputText: ${output.lightningUsername}
- assertVisible: ${output.lightningUsername}
- tapOn: "Choose your Lightning Address"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Success!"
    timeout: 10000

# Home screen
- extendedWaitUntil:
    visible: "History"
    timeout: 10000
