# email-verification.yml

appId: com.noahwallet.regtest
---
- runScript: scripts/lightning-address.js

- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: subflows/start-wallet-onboarding.yml

# Emergency Email screen
- extendedWaitUntil:
    visible: "Emergency Email"
    timeout: 10000
- tapOn:
    text: "your@email.com"
    optional: true
- inputText: "maestro@example.com"
- tapOn: "Send Verification Code"

# Verification Code screen
- extendedWaitUntil:
    visible: "Enter Verification Code"
    timeout: 10000
- inputText: "000000"
- tapOn: "Verify Email"

# Lightning Address screen
- extendedWaitUntil:
    visible: "Choose your Lightning Address"
    timeout: 10000
- tapOn:
    point: "50%,33%"
- eraseText: 40
- inputText: ${output.lightningUsername}
- assertVisible: ${output.lightningUsername}
# Maestro can report Save as visible while the iOS keyboard covers it.
- pressKey: Enter
- scrollUntilVisible:
    element:
      text: "Save"
    direction: DOWN
    centerElement: true
- tapOn: "Save"

# Verify the saved identity, rather than the transient success banner.
- extendedWaitUntil:
    visible: "History"
    timeout: 10000
- tapOn: "Open settings"
- tapOn:
    id: "settings-profile"
- assertVisible: ".*${output.lightningUsername}@localhost[.]com.*"
- assertVisible: ".*maestro@example[.]com.*"
