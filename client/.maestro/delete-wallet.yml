appId: com.noahwallet.regtest
---
- launchApp:
    clearState: true
    clearKeychain: true

- runFlow: subflows/start-wallet-onboarding.yml
- runFlow: subflows/complete-wallet-onboarding-without-email.yml

- tapOn: "Open settings"
- scrollUntilVisible:
    element:
      text: "Delete Wallet"
    direction: DOWN
    centerElement: true
- tapOn: "Delete Wallet"
- tapOn:
    text: 'Type "delete" to confirm'
# Retry only text entry if automation drops a character.
- retry:
    maxRetries: 2
    commands:
      - eraseText: 6
      - inputText: "delete"
      - assertVisible: "^delete$"
# Submit through the existing Done action without targeting a moving sheet button.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Welcome to Noah"
    timeout: 60000
