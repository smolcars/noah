appId: com.noahwallet.regtest
---
- launchApp:
    clearState: true

- tapOn: "Create Wallet"
- assertVisible: "Noah is in beta"
- tapOn: "I accept"
- assertVisible: "Your Recovery Phrase"
- tapOn: "I Have Saved It, Continue"
- extendedWaitUntil:
    visible: "Emergency Email"
    timeout: 10000
- tapOn: "Continue without email"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Disable battery optimization"
      - tapOn: "Skip"
- extendedWaitUntil:
    visible: "Choose your Lightning Address"
    timeout: 10000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "History"
    timeout: 10000

- tapOn: "Receive"
- extendedWaitUntil:
    visible:
      id: "receive-qr-button"
    timeout: 15000

- tapOn:
    id: "receive-qr-button"
- assertVisible: "Copy payment details"
- assertVisible:
    id: "receive-copy-ark"
- assertVisible:
    id: "receive-copy-onchain"
- assertNotVisible:
    id: "receive-copy-lightning"
- tapOn: "Close payment details"

- tapOn: "Add amount"
- tapOn:
    id: "receive-note-button"
- assertVisible: "What is the payment for?"
- tapOn:
    id: "receive-note-input"
- inputText: "Test payment"
- tapOn:
    id: "receive-note-done"
- assertVisible:
    id: "receive-key-5"
- tapOn:
    id: "receive-key-5"
- tapOn:
    id: "receive-key-0"
- tapOn:
    id: "receive-key-0"
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Edit amount"
    timeout: 15000

- tapOn:
    id: "receive-qr-button"
- assertVisible:
    id: "receive-copy-lightning"
- tapOn: "Close payment details"

- tapOn: "Edit amount"
- assertVisible: "Update request"
- tapOn: "Remove amount"
- assertVisible: "Add amount"

- tapOn: "Share"
- pressKey: BACK
